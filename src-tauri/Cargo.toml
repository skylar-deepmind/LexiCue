[package]
name = "lexicue"
version = "0.2.0"
description = "LexiCue - Local-first vocabulary learning tool"
authors = ["skylar-deepmind"]
license = "MIT"
repository = "https://github.com/skylar-deepmind/LexiCue"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros", "process"] }
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
flate2 = "1.1"
zstd = "0.13"
sha2 = "0.10"
lindera = { version = "4.0.1", features = ["embed-unidic"] }
jieba-rs = "0.10"
tauri-plugin-stronghold = "2"
keyring = { version = "4.1.6", features = ["android-native-keyring-store"] }

[dev-dependencies]
tempfile = "3"
