[workspace]
members = ["lan-journal"]
exclude = ["vendor/msedge-tts"]
resolver = "2"

[package]
name = "lexicue"
version = "0.4.7"
description = "LexiCue - Local-first vocabulary learning tool"
authors = ["skylar-deepmind"]
license = "MIT"
repository = "https://github.com/skylar-deepmind/LexiCue"
edition = "2021"
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
lan-sync = []
dictionary-native-qa = []

[build-dependencies]
sha2 = "0.10"
serde_json = "1.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
lexicue-lan-journal = { path = "lan-journal" }
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "=2.3.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
regex = "1"
unicode-normalization = "0.1"
percent-encoding = "2"
libloading = "0.7"
libc = "0.2"
log = "0.4"
tauri-plugin-log = "2"
# Finder-launched apps do not inherit a terminal's proxy environment. Keep the
# platform proxy resolver while selecting rustls instead of reqwest's TLS defaults.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["time", "macros", "process", "sync", "fs", "io-util"] }
base64 = "0.22"
msedge-tts = { path = "vendor/msedge-tts", default-features = false, features = ["tokio-runtime"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
fs2 = "=0.4.3"
flate2 = "1.1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
zstd = "0.13"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
lindera = { version = "4.0.1", default-features = false }
jieba-rs = "0.10"
keyring = { version = "4.1.6", features = ["android-native-keyring-store"] }
keyring-core = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["protected"] }
objc2-ui-kit = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVSpeechSynthesis", "AVAudioPlayer"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["crypto", "ring"] }
p12 = "0.6.3"

[dev-dependencies]
# Historical language/migration regression fixtures only; never shipped.
lindera = { version = "4.0.1", features = ["embed-unidic"] }
tempfile = "3"

# Large model checksums must not block debug builds for minutes.
[profile.dev.package.sha2]
opt-level = 3
