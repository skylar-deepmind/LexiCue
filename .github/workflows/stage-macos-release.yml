name: Stage notarized macOS installer (manual, no publication)

# Optional future runner integration. Local scripts/macos-release.mjs works
# without Actions or a self-hosted runner. Do not run this on untrusted code.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check is read-only; build-notarized signs and submits to Apple'
        type: choice
        options:
          - check
          - build-notarized
        default: check

permissions:
  contents: read

jobs:
  stage:
    # Credentials must only be made available to a reviewed default-branch commit.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: [self-hosted, macOS, lexicue-release]
    environment: macos-release
    timeout-minutes: 120
    env:
      MACOS_STAGE_MODE: ${{ inputs.mode }}
      LEXICUE_SYNC_ENDPOINT: ${{ vars.LEXICUE_SYNC_ENDPOINT }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # The key is pre-provisioned in a private file, never stored in an artifact.
      APPLE_API_KEY_PATH: ${{ vars.APPLE_API_KEY_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Test fail-closed gate
        run: node --test scripts/macos-release.test.mjs
      - name: Check local readiness without signing or uploading
        run: node scripts/macos-release.mjs check
      - name: Build, notarize and verify installer
        if: ${{ inputs.mode == 'build-notarized' }}
        run: node scripts/macos-release.mjs build
      - name: Retain verified staging artifacts (not a GitHub Release)
        if: ${{ inputs.mode == 'build-notarized' }}
        uses: actions/upload-artifact@v4
        with:
          name: LexiCue-macOS-verified-${{ runner.arch }}-${{ github.sha }}
          path: |
            src-tauri/target/macos-public/release/bundle/dmg/*.dmg
            src-tauri/target/macos-public/macos-release-verification.json
          if-no-files-found: error
          retention-days: 14
