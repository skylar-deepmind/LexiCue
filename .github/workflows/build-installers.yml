name: Build Installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to build (all / macos / windows / android)'
        type: choice
        options:
          - all
          - macos
          - windows
          - android
        default: all
      draft:
        description: 'Create the GitHub release as a draft (updates stay invisible until published)'
        type: boolean
        default: false

jobs:
  macos:
    name: macOS (Apple Silicon / Intel)
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiCue v__VERSION__'
          releaseDraft: ${{ inputs.draft }}
          prerelease: false
          retryAttempts: 2
          args: --target ${{ matrix.target }} --bundles app,dmg

  windows:
    name: Windows Installer
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiCue v__VERSION__'
          releaseDraft: ${{ inputs.draft }}
          prerelease: false
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: --bundles nsis

  android:
    name: Android APK
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Android project
        run: npx tauri android init
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lexicue-release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/lexicue-release.keystore"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lexicue-release.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiCue v__VERSION__'
          releaseDraft: ${{ inputs.draft }}
          prerelease: false
          retryAttempts: 1
          mobile: android
          args: --apk --target aarch64
      - name: Verify and checksum signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="v${version}"
          download_dir="$(mktemp -d)"
          checksum_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir" "$checksum_dir"' EXIT

          echo "Verifying Android assets from Release: ${tag}"
          mapfile -t apk_names < <(
            gh release view "$tag" --json assets \
              --jq '.assets[] | select(.name | endswith(".apk")) | .name'
          )
          if [ "${#apk_names[@]}" -eq 0 ]; then
            echo "No APK assets were found in Release ${tag}. Current assets:"
            gh release view "$tag" --json assets \
              --jq '.assets[] | "- \(.name) (\(.size) bytes)"' || true
            exit 1
          fi

          gh release download "$tag" --pattern '*.apk' --dir "$download_dir" --clobber

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/apkanalyzer' -perm -u+x | sort -V | tail -n 1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "Unable to locate apksigner under $ANDROID_HOME/build-tools"
            exit 1
          fi
          if [ -z "$apkanalyzer" ] || [ ! -x "$apkanalyzer" ]; then
            echo "Unable to locate apkanalyzer under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          mapfile -t apks < <(find "$download_dir" -type f -name '*.apk' -print | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Release ${tag} listed APK assets, but none could be downloaded"
            exit 1
          fi

          checksums=()
          for apk in "${apks[@]}"; do
            apk_name="$(basename "$apk")"
            echo "Verifying $apk_name"
            echo "Path: $apk"
            echo "Size: $(stat -c '%s' "$apk") bytes"
            "$apksigner" verify --verbose "$apk"
            echo "APK summary:"
            "$apkanalyzer" apk summary "$apk"
            echo "Application ID: $($apkanalyzer manifest application-id "$apk")"
            echo "Version code: $($apkanalyzer manifest version-code "$apk")"
            echo "Version name: $($apkanalyzer manifest version-name "$apk")"
            abis="$($apkanalyzer files list "$apk" | awk -F/ '$1 == "lib" && $2 != "" { print $2 }' | sort -u | paste -sd, -)"
            echo "ABIs: ${abis:-universal/resource-only}"

            checksum_file="$checksum_dir/${apk_name}.sha256"
            checksum="$(sha256sum "$apk" | awk '{print $1}')"
            printf '%s  %s\n' "$checksum" "$apk_name" | tee "$checksum_file"
            checksums+=("$checksum_file")
          done

          gh release upload "$tag" "${checksums[@]}" --clobber
