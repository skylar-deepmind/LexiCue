services:
  api:
    build:
      context: ../sync-server
    image: lexicue-sync-server:${LEXICUE_SYNC_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://lexicue:${POSTGRES_PASSWORD}@db:5432/lexicue
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      SYNC_METRICS_TOKEN: ${SYNC_METRICS_TOKEN:?Set SYNC_METRICS_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexicue
      POSTGRES_USER: lexicue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexicue -d lexicue"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.75"

volumes:
  postgres-data: {}
