services:
  api:
    build: ../sync-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lexicue:${POSTGRES_PASSWORD}@db:5432/lexicue
      RUST_LOG: info
      SYNC_METRICS_TOKEN: ${SYNC_METRICS_TOKEN:-}
    depends_on:
      db: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512M, cpus: "1.0" } } }
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexicue
      POSTGRES_USER: lexicue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lexicue -d lexicue"], interval: 10s, timeout: 5s, retries: 5 }
    deploy: { resources: { limits: { memory: 1G, cpus: "0.75" } } }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
volumes:
  postgres-data: {}
  caddy-data: {}
  caddy-config: {}
