# Use this file when another project already owns ports 80/443 and Caddy.
# It attaches the API to that project's external Docker network so Caddy can
# proxy to lexicue-sync-api:8080 without exposing the database or API ports.
services:
  api:
    container_name: lexicue-sync-api
    build: ../sync-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lexicue:${POSTGRES_PASSWORD}@db:5432/lexicue
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - existing-caddy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexicue
      POSTGRES_USER: lexicue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexicue -d lexicue"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.75"

volumes:
  postgres-data: {}

networks:
  internal: {}
  existing-caddy:
    external: true
    name: naoii_naoii-net
